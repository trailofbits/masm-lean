name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run; `main` runs are
# never cancelled so the default branch always has a conclusive result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Mathlib is the bulk of the work: a cold build is long, a warm one is
    # minutes. The proof suite itself contains individually expensive modules
    # (U128/Divmod and friends run into the minutes).
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Keyed on the toolchain and the dependency manifest: a Mathlib bump
      # invalidates it, ordinary proof edits do not.
      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-

      - name: Fetch Mathlib build cache
        run: lake exe cache get || echo "cache unavailable; building Mathlib from source"

      # The library and proofs. A clean build with no `sorry` means every
      # correctness theorem is machine-checked.
      #
      # Warnings are failures. Roughly 30 linters are enabled by default in
      # Lean/Mathlib (unusedTactic, unusedSimpArgs, unnecessarySimpa,
      # unreachableTactic, unusedVariables, dupNamespace, nameCheck, deprecated,
      # …) and this library already satisfies all of them — but `lake build`
      # exits 0 with warnings, so without this gate that compliance is
      # unprotected and would rot silently. The lakefile additionally turns on
      # style.multiGoal, style.admit and style.setOption, which are also clean.
      - name: Build library and proofs (warnings are failures)
        run: |
          set -o pipefail
          lake build MidenLean 2>&1 | tee /tmp/build.log
          if grep -q "warning:" /tmp/build.log; then
            echo "::error::build emitted warnings (linter findings are failures here)"
            grep -n "warning:" /tmp/build.log | head -50
            exit 1
          fi

      # Not part of the default target by design, so it must be built
      # explicitly — this is exactly how Symbolic/TacticTest.lean silently
      # stopped compiling after the Concrete/ restructure.
      - name: Build symbolic regression tests
        run: lake build MidenLeanTests

      # Ask the kernel which axioms each declaration actually depends on,
      # rather than grepping for the word `sorry`. This catches a `sorry`
      # reached transitively through a helper lemma (whose own text is clean)
      # and cannot be fooled by the word appearing in a comment or docstring —
      # both of which have bitten this repo. It also asserts the full axiom
      # footprint, so a new trust assumption cannot appear unnoticed.
      - name: Axiom audit (no sorryAx, no unexpected axioms)
        run: lake env lean scripts/AxiomCheck.lean

      # Rebuilds each manual proof module with a strict per-module timeout and
      # warns on structural problems (missing/misnamed *_correct theorems,
      # placeholder doc comments). Also proves the README tables are current.
      - name: Verified-procedure tables are warning-free and in sync
        run: |
          python3 scripts/generate_verified_tables.py > /tmp/tables.md 2> /tmp/tables.err
          if grep -q warning /tmp/tables.err; then
            echo "::error::generate_verified_tables.py emitted warnings"
            cat /tmp/tables.err
            exit 1
          fi
          python3 - <<'EOF'
          import sys
          tables = open('/tmp/tables.md').read().strip()
          if tables not in open('README.md').read():
              sys.exit("::error::README verified-procedures section is stale; "
                       "regenerate with scripts/generate_verified_tables.py")
          print("README tables in sync")
          EOF

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-

      - name: Fetch Mathlib build cache
        run: lake exe cache get || echo "cache unavailable; building Mathlib from source"

      - name: Build library
        run: lake build MidenLean

      # Batteries' linters are opt-in for Mathlib-dependent projects, so a
      # green `lake build` does not exercise them. simpNF in particular catches
      # simp lemmas that are redundant or not in simp-normal form — six such
      # lemmas were live here until they were found this way.
      #
      # Deliberately omitted: `unusedArguments`, which does not finish within
      # a reasonable budget at this library size. Re-add it (per-module) if
      # someone makes it affordable.
      # Mathlib-provided, so it cannot go in the package's `leanOptions` (those
      # reach core-Lean-only modules like Symbolic/SimpAttrs.lean, where the
      # option does not exist and `-D` on an unknown option is a hard error).
      # Enforced per-file instead. `native_decide` puts the Lean compiler in the
      # trusted base of every dependent theorem, so a NEW one must be a
      # deliberate, reviewed act — note the axiom audit will NOT catch it, since
      # it reuses the already-whitelisted ofReduceBool/trustCompiler axioms.
      - name: No new native_decide
        run: |
          status=0
          for f in $(git ls-files 'MidenLean/**/*.lean' | grep -v '^MidenLean/Proofs/Generated/'); do
            grep -q '^import Mathlib' "$f" || continue          # option is Mathlib-provided
            grep -q 'linter.style.nativeDecide false' "$f" && continue   # documented exception
            out=$(lake env lean -Dlinter.style.nativeDecide=true "$f" 2>&1 || true)
            if echo "$out" | grep -q "native_decide"; then
              echo "::error file=$f::native_decide introduced"; echo "$out" | head -5; status=1
            fi
          done
          exit $status

      # The `miden*` linters are this project's own, defined in
      # `MidenLean/Linters.lean` and reached through `import MidenLean`. They
      # check invariants no generic linter can express: that the doc comments
      # `scripts/generate_verified_tables.py` scrapes into the README actually
      # say something, that every `_exec` execution summary is registered with
      # `@[miden_exec_summary]` (an untagged one silently degrades every caller
      # to re-deriving the callee body), and that every `Instruction`
      # constructor has a soundness lemma or a documented exception.
      - name: Batteries + project linters
        run: |
          cat > /tmp/Lint.lean <<'EOF'
          import MidenLean
          #lint only simpNF dupNamespace simpVarHead
            midenCorrectDocs midenExecSummaryTagged midenSoundnessCoverage in MidenLean
          EOF
          lake env lean /tmp/Lint.lean 2>&1 | tee /tmp/lint.out
          if grep -qE '^-- Found [1-9]' /tmp/lint.out; then
            echo "::error::linter findings above"
            exit 1
          fi

  # Mathlib's full `mathlibStandardSet` (long lines, undocumented
  # `set_option maxHeartbeats`, cdot/cases/induction style, docstring rules, …)
  # is ADVISORY for now: the existing tree has roughly 960 findings — ~576 lines
  # over 100 characters across 64 files, plus ~387 `maxHeartbeats` overrides
  # that want an explanatory comment. Gating on that today would fail every PR.
  #
  # So it runs only over the files a PR touches, and does not block. Burn the
  # backlog down, then move this into the `lint` job and drop
  # `continue-on-error`.
  style-advisory:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-

      - name: Fetch Mathlib build cache
        run: lake exe cache get || echo "cache unavailable; building Mathlib from source"

      - name: Build library
        run: lake build MidenLean

      # Passed with -D rather than via lakefile `leanOptions`, which would
      # change the build hash and force a full rebuild. Note that -D silently
      # ignores UNKNOWN options, so a typo here reads as "clean" — the option
      # name below is verified to exist and to fire.
      - name: Mathlib standard linter set on changed files
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
                     -- 'MidenLean/**/*.lean' \
                     | grep -v '^MidenLean/Proofs/Generated/' || true)
          if [ -z "$changed" ]; then
            echo "no library files changed"; exit 0
          fi
          status=0
          for f in $changed; do
            [ -f "$f" ] || continue
            echo "--- $f"
            lake env lean -Dlinter.mathlibStandardSet=true "$f" 2>&1 | tee /tmp/style.out
            if grep -qE 'warning|error' /tmp/style.out; then status=1; fi
          done
          exit $status
