[package]
name = "masm-to-lean"
version = "0.1.0"
edition = "2021"

[dependencies]
miden-assembly-syntax = { version = "=0.22.0", git = "https://github.com/0xMiden/miden-vm", rev = "821990729b83112fafe6de38377d55323c2db9c5", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Optional: symbolic constraint extraction via p3 SymbolicAirBuilder
miden-air = { path = "../../audit-miden-vm/air", optional = true }
miden-core = { path = "../../audit-miden-vm/core", optional = true }
p3-air = { version = "0.5", optional = true }
p3-field = { version = "0.5", optional = true }
p3-goldilocks = { version = "0.5", optional = true }

[features]
default = []
symbolic = ["miden-air", "miden-core", "p3-air", "p3-field", "p3-goldilocks"]

[[bin]]
name = "masm-to-lean"
path = "src/main.rs"

[[bin]]
name = "symbolic-extract"
path = "src/symbolic.rs"
required-features = ["symbolic"]
